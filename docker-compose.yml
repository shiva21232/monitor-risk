services:
  risk-monitor:
    build: .
    ports:
      - "8010:8000"
    environment:
      AWS_REGION: us-east-1
      BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
      RISK_WEBHOOK_URL: http://risk-webhook:8080/alerts
      RISK_WEBHOOK_SECRET: ${RISK_WEBHOOK_SECRET:-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    env_file:
      - path: .env
        required: false

  risk-webhook:
    build: .
    command: ["node", "dist/webhook.js"]
    ports:
      - "8081:8080"
    environment:
      RISK_WEBHOOK_SECRET: ${RISK_WEBHOOK_SECRET:-change-me}
